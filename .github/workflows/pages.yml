name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build site (stamp asset versions so browsers load fresh files)
        run: |
          mkdir _site
          cp -r index.html css js samples LICENSE _site/
          sed -i "s/?v=dev/?v=${GITHUB_SHA::8}/g" _site/index.html
          grep -c "?v=${GITHUB_SHA::8}" _site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
